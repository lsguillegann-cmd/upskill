<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Practice App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.5;
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1rem;
      color: #222;
    }

    button {
      padding: 0.6rem 1rem;
      border: 0;
      border-radius: 4px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Practice App</h1>
  <p>This is a small beginner web app built while learning GitHub and web development.</p>
  <button id="hello-button" type="button">Click me</button>

  <script>
    const button = document.querySelector('#hello-button');

    button.addEventListener('click', () => {
      button.textContent = 'Hello!';
    });
  </script>
</body>
</html>
